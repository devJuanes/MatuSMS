# Configuración temporal SOLO para obtener el certificado SSL (antes del despliegue final).
#
# 1. Crear carpeta dist vacía o con un index.html de prueba
# 2. sudo certbot certonly --webroot -w /var/www/certbot -d matusms.matubyte.com
# 3. Reemplazar por deploy/nginx/matusms.matubyte.com.conf

root /var/www/matusms-web;
index index.html;

server {
    listen 80;
    listen [::]:80;
    server_name matusms.matubyte.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
