# Configuración temporal SOLO para obtener el certificado SSL (antes del despliegue final).
# Usar mientras no existan los certificados en /etc/letsencrypt/
#
# 1. Copiar este archivo en lugar del definitivo
# 2. sudo certbot certonly --webroot -w /var/www/certbot -d api.sms.matubyte.com
# 3. Reemplazar por deploy/nginx/api.sms.matubyte.com.conf

upstream matusms_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sms.matubyte.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://matusms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
