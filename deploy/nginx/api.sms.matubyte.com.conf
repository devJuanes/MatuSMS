# MatuSMS API — api.sms.matubyte.com
# Copiar a: /etc/nginx/sites-available/api.sms.matubyte.com
# Enlazar:  sudo ln -sf /etc/nginx/sites-available/api.sms.matubyte.com /etc/nginx/sites-enabled/

upstream matusms_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirigir HTTP → HTTPS (activar después de obtener certificado con certbot)
server {
    listen 80;
    listen [::]:80;
    server_name api.sms.matubyte.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sms.matubyte.com;

    # Certbot rellena estas rutas al ejecutar:
    #   sudo certbot certonly --webroot -w /var/www/certbot -d api.sms.matubyte.com
    ssl_certificate     /etc/letsencrypt/live/api.sms.matubyte.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sms.matubyte.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Adjuntos SMS (máx. 5 MB en API)
    client_max_body_size 6M;

    access_log /var/log/nginx/matusms-api.access.log;
    error_log  /var/log/nginx/matusms-api.error.log;

    # Socket.IO (WebSockets)
    location /socket.io/ {
        proxy_pass http://matusms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://matusms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
